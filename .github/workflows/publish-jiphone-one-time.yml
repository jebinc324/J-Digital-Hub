name: Publish J iPhone Share v0.2.1 APK (one-time)
on:
  push:
    paths:
      - '.github/workflows/publish-jiphone-one-time.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and authenticate built APK
        env:
          PACKAGE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d660-81f4-91f6-79992fb3f9ec/raw?se=2026-11-09T06%3A56%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=ae3b54bc-a660-5b4c-a50b-a9f2e3106516&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T03%3A03%3A04Z&ske=2026-11-10T03%3A03%3A04Z&sks=b&skv=2026-02-06&sig=vvaMN%2BLerk/UMb8SVvxa/UCHwuyjKgkP%2B4%2B10rj2rUs%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 "$PACKAGE_URL" -o /tmp/jiphone-artifact.zip
          unzip -p /tmp/jiphone-artifact.zip app-debug.apk > /tmp/j-iphone-share-v0.2.1.apk
          echo "a888c8b7cd129778b22f9110f563c8c8de1003eb1116e42f67c36fbf4d8bd48c  /tmp/j-iphone-share-v0.2.1.apk" | sha256sum -c -
          test "$(stat -c%s /tmp/j-iphone-share-v0.2.1.apk)" = "132728"
      - name: Add verified APK to Just24 public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload just24-public-v1 /tmp/j-iphone-share-v0.2.1.apk --clobber
          gh release view just24-public-v1 --json assets --jq '.assets[] | select(.name == "j-iphone-share-v0.2.1.apk") | .name + " (" + (.size|tostring) + " bytes)"'
