name: Publish verified J Media Player v1.3.5 APK from private transfer (once)
on:
  push:
    paths: ['.github/workflows/publish-jmedia-v135-from-blobs-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original-key signed APK from verified Git data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/jmedia-apk.b64
          while read -r blob; do
            test -n "$blob"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$blob" --jq '.content' |
              base64 -d >> /tmp/jmedia-apk.b64
          done <<'BLOBS'
          4b19dd5f370f49e013ba404e9bf32c0a88ac8ae6
          c7060e0da091e00730480c9d8a08b623c0c97c80
          e6c60bf4c8399b4715068c8fb9aa1b3116e41cc9
          b748f1303a2b1d0139d0881b148615aefe98d273
          9cb2cd115f7167626a42a04b37575007978a71f2
          2080be202e6916469a74018fefb49a400c0175ee
          141fc39b3e8d610d1fc11e838f985c7c76371e2a
          e5abc561975af62f359d704d46cefd0167478a20
          d8ad426be820c197ae153a9e44e512e37eb86442
          84c0ba55dab8c7964decfa566b849dfb66628467
          3be85b93926c3dbc4436f6773ac5e1d4cbcc31bc
          a71759117696e55f34e1d1035b70f6f707c7c1da
          26169b503197f3b8e2a67b51c815eec0a362443a
          9228ff8f4238203967b3eefd05335d51e784cb47
          7b17a8a91396cdf699e78e447f59efe16dc5c267
          f83cbeb4275e28296b57a74a85206720ef2264a7
          fd9bbb6204cdf773310e76578a5feb101098e2cc
          ce98666a7e7823a8e447cde9c4d33875017291cd
          dc3021ca3906877937e02c52b66ad97facd4a9b7
          7fc2a09c0e45dec534d3bacf4949bf5fcc40d70c
          6b2613298f540bd7b121c912324dbabae4a49027
          BLOBS
          base64 -d /tmp/jmedia-apk.b64 > /tmp/j-media-player-v1.3.5-stable-key.apk
          echo 'b59c943ae26f750e2e9822b955b4a803c95ddb7abb174b3f3159f43da1be2cba  /tmp/j-media-player-v1.3.5-stable-key.apk' | sha256sum -c -
          test "$(stat -c%s /tmp/j-media-player-v1.3.5-stable-key.apk)" = '9268175'
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APK_SIGNER" verify --print-certs /tmp/j-media-player-v1.3.5-stable-key.apk | tee /tmp/media-cert.txt
          grep -q 'certificate SHA-256 digest: 93823ab0f2ded987ac1e4cc320cbe9ceef6fd8edfcad5d005f33eec432d21462' /tmp/media-cert.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging /tmp/j-media-player-v1.3.5-stable-key.apk | grep -m1 '^package:' | grep -q "versionCode='11' versionName='1.3.5'"
      - name: Upload public website APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload just24-public-v1 /tmp/j-media-player-v1.3.5-stable-key.apk --clobber
          gh release view just24-public-v1 --json assets --jq '.assets[] | select(.name=="j-media-player-v1.3.5-stable-key.apk") | .name + ": " + (.size|tostring) + " bytes"'
