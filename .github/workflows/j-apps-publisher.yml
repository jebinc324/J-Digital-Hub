name: J Apps Publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What do you want to do?"
        type: choice
        required: true
        default: update
        options:
          - update
          - add
          - remove
      app_id:
        description: "App ID, e.g. j-expense-tracker-my-expense-tracker"
        type: string
        required: true
      apk_filename:
        description: "Add/update: APK filename. Remove: type REMOVE:app-id to confirm"
        type: string
        required: true
      version:
        description: "Version, e.g. v3.2.16 (optional for updates)"
        type: string
        required: false
      name:
        description: "App name (required only for new apps)"
        type: string
        required: false
      description:
        description: "Short description (required only for new apps)"
        type: string
        required: false
      family:
        description: "For new apps; updates keep the original family"
        type: choice
        required: true
        default: Android
        options:
          - Android
          - Revit Add-ins
          - Revit Dynamo
      category:
        description: "Optional: Engineering, Automation, Finance & Trading, Productivity & Files, Media & Creative, Kids & Games, Device & Safety, Lifestyle"
        type: string
        required: false
      logo_path:
        description: "Choose logo in private local Media Studio; leave blank here for auto-attach"
        type: string
        required: false
      screenshots:
        description: "Choose screenshots in private local Media Studio; leave blank for auto-attach"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: j-apps-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify APK and update J Apps catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_MODE: ${{ inputs.mode }}
          APP_ID: ${{ inputs.app_id }}
          ASSET_FILENAME: ${{ inputs.apk_filename }}
          APP_VERSION: ${{ inputs.version }}
          APP_NAME: ${{ inputs.name }}
          APP_DESCRIPTION: ${{ inputs.description }}
          APP_FAMILY: ${{ inputs.family }}
          APP_CATEGORY: ${{ inputs.category }}
          APP_LOGO: ${{ inputs.logo_path }}
          APP_SCREENSHOTS: ${{ inputs.screenshots }}
        run: |
          python3 .github/scripts/publish_j_app.py \
            --mode "$ACTION_MODE" \
            --app-id "$APP_ID" \
            --apk-filename "$ASSET_FILENAME" \
            --version "$APP_VERSION" \
            --name "$APP_NAME" \
            --description "$APP_DESCRIPTION" \
            --family "$APP_FAMILY" \
            --category "$APP_CATEGORY" \
            --logo-path "$APP_LOGO" \
            --screenshots "$APP_SCREENSHOTS"
      - name: Validate website changes
        run: |
          git diff --check
          bash tests/run_checks.sh
      - name: Open draft publishing PR (never push to main)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_MODE: ${{ inputs.mode }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          git add public/apps/catalog.json public/apps/index.html public/apps/access/index.html public/index.html
          if git diff --cached --quiet; then
            echo "Catalogue already up to date."
            exit 0
          fi
          branch="publisher/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "J Apps Publisher ${ACTION_MODE}: ${APP_ID}"
          git push origin "HEAD:$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "J Apps Publisher ${ACTION_MODE}: ${APP_ID}" \
            --body "Automated catalogue change. Check release metadata and CI; review and merge manually before Render deploys. Metadata alone does not confirm APK/ZIP safety."
