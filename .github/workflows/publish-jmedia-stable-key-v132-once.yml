name: Publish J Media Player v1.3.2 original stable-key APK (one-time)
on:
  push:
    paths: ['.github/workflows/publish-jmedia-stable-key-v132-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download original-key signed Media Player build
        env:
          SOURCE_ZIP: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-78a4-820b-ad91-03e9b978b6cd/raw?se=2026-11-09T10%3A58%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=d1a3697f-540d-53ad-a016-912a02b14d72&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T01%3A22%3A28Z&ske=2026-11-10T01%3A22%3A28Z&sks=b&skv=2026-02-06&sig=fWw3yzxnhpcETczFFTAwOMN1D%2BaBujRxo1IPC6dzhHw%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 "$SOURCE_ZIP" -o /tmp/jmedia-artifact.zip
          unzip -p /tmp/jmedia-artifact.zip app-release.apk > /tmp/j-media-player-v1.3.2-stable-key.apk
          echo '9f7412cb686e304610f5f8f724b5c01fb1244e255058b79f7382ecf883009d55  /tmp/j-media-player-v1.3.2-stable-key.apk' | sha256sum -c -
          test "$(stat -c%s /tmp/j-media-player-v1.3.2-stable-key.apk)" = '9265763'
          unzip -t /tmp/j-media-player-v1.3.2-stable-key.apk >/dev/null
      - name: Verify original Media stable certificate
        run: |
          set -euo pipefail
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APK_SIGNER" verify --print-certs /tmp/j-media-player-v1.3.2-stable-key.apk | tee /tmp/media-cert.txt
          grep -q 'certificate SHA-256 digest: 93823ab0f2ded987ac1e4cc320cbe9ceef6fd8edfcad5d005f33eec432d21462' /tmp/media-cert.txt
      - name: Upload separate stable-key APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload just24-public-v1 /tmp/j-media-player-v1.3.2-stable-key.apk --clobber
          gh release view just24-public-v1 --json assets --jq '.assets[] | select(.name=="j-media-player-v1.3.2-stable-key.apk") | .name + " (" + (.size|tostring) + " bytes)"'
