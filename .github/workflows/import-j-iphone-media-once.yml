name: Import J iPhone Share original screenshots and icon (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-j-iphone-media-once.yml'
permissions:
  contents: write
jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify user-provided media
        env:
          ICON_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3JAcLomzqgt2ZqHibPv51E4SOTO/ef12acce-c823-43a2-9de9-d8ecad09961e.png"
          LIGHT_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3JAcLomzqgt2ZqHibPv51E4SOTO/0b6116ac-a0d9-471f-8bee-fb6fc222a96b.jpg"
          DARK_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3JAcLomzqgt2ZqHibPv51E4SOTO/e6ae557e-cebb-4468-bde7-3b4b8431bcb8.jpg"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 90 "$ICON_URL" -o /tmp/share-icon.png
          curl -fL --retry 3 --max-time 90 "$LIGHT_URL" -o /tmp/share-light.jpg
          curl -fL --retry 3 --max-time 90 "$DARK_URL" -o /tmp/share-dark.jpg
          echo '8007f41c07e595276209f21dd86a978c48173b0d5774dde0b492ea46f6cebc23  /tmp/share-icon.png' | sha256sum -c -
          echo '53b070eaefa52fec02363d8e1222fca637fead88ae29c01f4e94dffad6704909  /tmp/share-light.jpg' | sha256sum -c -
          echo '64be48cd534ea2e443019204fbad5c849bffdbdfe2b3cb0ae80f9525b232c359  /tmp/share-dark.jpg' | sha256sum -c -
      - name: Optimize originals for website gallery
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out=Path("public/assets/apps")
          (out/"icons").mkdir(parents=True,exist_ok=True)
          screenshots=out/"screenshots/j-iphone-share"
          screenshots.mkdir(parents=True,exist_ok=True)
          with Image.open("/tmp/share-icon.png") as original:
              icon=original.convert("RGBA")
              icon.thumbnail((512,512),Image.Resampling.LANCZOS)
              icon.save(out/"icons/j-iphone-share.webp",format="WEBP",quality=92,method=6)
          for src,dest in [("/tmp/share-light.jpg","01.webp"),("/tmp/share-dark.jpg","02.webp")]:
              with Image.open(src) as original:
                  screenshot=original.convert("RGB")
                  screenshot.save(screenshots/dest,format="WEBP",quality=87,method=6)
          for img in [out/"icons/j-iphone-share.webp", screenshots/"01.webp", screenshots/"02.webp"]:
              with Image.open(img) as image:
                  image.verify()
              print(img,img.stat().st_size)
          PY
      - name: Commit uploaded media
        run: |
          set -euo pipefail
          git add public/assets/apps/icons/j-iphone-share.webp public/assets/apps/screenshots/j-iphone-share/01.webp public/assets/apps/screenshots/j-iphone-share/02.webp
          git diff --cached --quiet && { echo 'Media unchanged'; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add original J iPhone Share logo and Light/Dark screenshots"
          git push origin HEAD:main
