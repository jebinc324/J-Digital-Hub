name: Publish J Share v0.4.1 APK (one-time)
on:
  push:
    paths: ['.github/workflows/publish-j-share-v041-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Obtain and verify signed J Share build
        env:
          SOURCE_ZIP: "https://sdmntpreastus3.oaiusercontent.com/files/00000000-bc20-8212-ac99-f91cc8517e55/raw?se=2026-11-09T10%3A18%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=c3db3dbd-ead6-5726-8ca9-615a8fb1b989&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T01%3A01%3A35Z&ske=2026-11-10T01%3A01%3A35Z&sks=b&skv=2026-02-06&sig=n%2BIzaubW%2Bh9esIDCTfLq/uCH5rv3wyLDLFEHB12SvlU%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 "$SOURCE_ZIP" -o /tmp/share41.zip
          unzip -p /tmp/share41.zip app-debug.apk > /tmp/j-share-v0.4.1.apk
          echo 'c7310bfeffd8f27929ed3c29d5da319239b2de152d120446bced701f8d9c31ab  /tmp/j-share-v0.4.1.apk' | sha256sum -c -
          test "$(stat -c%s /tmp/j-share-v0.4.1.apk)" = "190176"
          unzip -t /tmp/j-share-v0.4.1.apk >/dev/null
      - name: Upload public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload just24-public-v1 /tmp/j-share-v0.4.1.apk --clobber
          gh release view just24-public-v1 --json assets --jq '.assets[] | select(.name == "j-share-v0.4.1.apk") | .name + " (" + (.size|tostring) + " bytes)"'
