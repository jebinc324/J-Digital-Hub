name: Check J Media & Archive update signatures; publish previews (one-time)
on:
  push:
    paths: ['.github/workflows/check-chooser-signing-publish-previews-once.yml']
permissions:
  contents: write
jobs:
  compare-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download original public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/original
          gh release download just24-public-v1 --pattern 'j-media-player.apk' --pattern 'j-archive-manager.apk' --dir /tmp/original
          echo '$(echo original assets downloaded)' >/dev/null
          test "$(stat -c%s /tmp/original/j-media-player.apk)" = "11342465"
          test "$(stat -c%s /tmp/original/j-archive-manager.apk)" = "10814708"
      - name: Download and verify current signed test builds
        env:
          MEDIA_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-11bc-820b-8b88-073d9a7fc4a5/raw?se=2026-11-09T10%3A25%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=7ee76112-eec1-5a5e-a2a0-764af6ee68c6&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T02%3A38%3A38Z&ske=2026-11-10T02%3A38%3A38Z&sks=b&skv=2026-02-06&sig=S92UfQ9tSFGvU%2Bpk7u6kFbXIM62amXKfApr77Fczfd4%3D"
          ARCHIVE_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-aacc-820b-945e-c6f57915e80e/raw?se=2026-11-09T10%3A25%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=885de853-9341-5745-9412-4f815f4a94e0&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T06%3A13%3A32Z&ske=2026-11-10T06%3A13%3A32Z&sks=b&skv=2026-02-06&sig=k3TirqASXFh9M1zHahQp1EuOQWY7H93EXms8y22G6yA%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 90 "$MEDIA_URL" -o /tmp/media-artifact.zip
          curl -fLsS --retry 3 --max-time 90 "$ARCHIVE_URL" -o /tmp/archive-artifact.zip
          unzip -p /tmp/media-artifact.zip app-debug.apk > /tmp/j-media-player-v1.3.2-preview.apk
          unzip -p /tmp/archive-artifact.zip app-debug.apk > /tmp/j-archive-manager-v1.0.3-preview.apk
          echo '1f0af23881c44bac9c13c61ebc4d62a4ef7e2547f5bcac3ecfa1e78a2184333d  /tmp/j-media-player-v1.3.2-preview.apk' | sha256sum -c -
          echo '5e5101105ce41ee0ae3f7fd59d29e2aaf652595c160e56e25e67cbafb119b164  /tmp/j-archive-manager-v1.0.3-preview.apk' | sha256sum -c -
          test "$(stat -c%s /tmp/j-media-player-v1.3.2-preview.apk)" = "11343046"
          test "$(stat -c%s /tmp/j-archive-manager-v1.0.3-preview.apk)" = "11491044"
      - name: Compare old and new signatures without hiding verification errors
        run: |
          set -euo pipefail
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          for kind in media archive; do
            if [ "$kind" = media ]; then old=/tmp/original/j-media-player.apk; new=/tmp/j-media-player-v1.3.2-preview.apk; else old=/tmp/original/j-archive-manager.apk; new=/tmp/j-archive-manager-v1.0.3-preview.apk; fi
            echo "=== $kind original APK signer ==="
            "$APK_SIGNER" verify --print-certs "$old" > /tmp/$kind-old.log 2>&1 || true
            tail -n 8 /tmp/$kind-old.log
            echo "=== $kind new APK signer ==="
            "$APK_SIGNER" verify --print-certs "$new" > /tmp/$kind-new.log 2>&1 || true
            tail -n 8 /tmp/$kind-new.log
            o=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/$kind-old.log | head -1)
            n=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/$kind-new.log | head -1)
            if [ -n "$o" ] && [ "$o" = "$n" ]; then
              echo "$kind=SIGNATURE_MATCH"
            else
              echo "$kind=SIGNATURE_MISMATCH_OR_UNVERIFIED"
            fi
          done
      - name: Publish previews separately from stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload just24-public-v1 /tmp/j-media-player-v1.3.2-preview.apk /tmp/j-archive-manager-v1.0.3-preview.apk --clobber
          gh release view just24-public-v1 --json assets --jq '.assets[] | select(.name | test("v1.3.2-preview|v1.0.3-preview")) | .name + " (" + (.size|tostring) + " bytes)"'
